<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>ЛР №6 — таблица данных</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #999;
            padding: 8px 12px;
            text-align: left;
        }

        th {
            background: #eeeeee;
        }
    </style>
</head>
<body>
    <h1>Среднее №4 — таблица данных</h1>

    {% if items %}
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Количество</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.quantity }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>В базе данных пока нет записей.</p>
    {% endif %}
</body>
</html>
